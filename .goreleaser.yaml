# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
builds:
  - dir: ./farmerbot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: farmerbot
    id: farmerbot

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/farmerbot/version.Version={{.Tag}}

  - dir: ./grid-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: tfcmd
    id: tfcmd

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/grid-cli/cmd.version={{.Tag}}
      - -X github.com/threefoldtech/zos_sdk_go/grid-cli/cmd.commit={{.Commit}}

  - dir: ./grid-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: tf-grid-cli
    id: tf-grid-cli

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/grid-cli/cmd.version={{.Tag}}
      - -X github.com/threefoldtech/zos_sdk_go/grid-cli/cmd.commit={{.Commit}}

  - dir: ./tfrobot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: tfrobot
    id: tfrobot

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/tfrobot/cmd.version={{.Tag}}
      - -X github.com/threefoldtech/zos_sdk_go/tfrobot/cmd.commit={{.Commit}}

  - dir: ./grid-proxy/cmds/proxy_server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: tfgridproxy
    id: tfgridproxy

    ldflags:
      - -w -s -X github.com/threefoldtech/zos_sdk_go/grid-proxy/cmd.version={{.Tag}} -extldflags '-static'
      - -X github.com/threefoldtech/zos_sdk_go/grid-proxy/cmd.commit={{.Commit}}

  - dir: ./gridify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: gridify
    id: gridify

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/gridify/cmd.version={{.Tag}}
      - -X github.com/threefoldtech/zos_sdk_go/gridify/cmd.commit={{.Commit}}

  - dir: ./monitoring-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: monitoring-bot
    id: monitoring-bot

    ldflags:
      - -X github.com/threefoldtech/zos_sdk_go/monitoring-bot/cmd.version={{.Tag}}
      - -X github.com/threefoldtech/zos_sdk_go/monitoring-bot/cmd.commit={{.Commit}}

  # - dir: ./tools/relay-cache-warmer
  #   goos:
  #     - linux
  #     - windows
  #     - darwin
  #   binary: cache-warmer
  #   id: cache-warmer

  #   ignore:
  #     - goos: windows
  #   ldflags:
  #     - -X main.version={{.Tag}}
  #     - -X main.commit={{.Commit}}

archives:
  - formats: ['tar.gz']
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ['zip']
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

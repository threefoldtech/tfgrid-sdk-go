services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: deployment-checker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deployment_checker
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: deployment-checker-pgweb
    ports:
      - "${VIEW_PORT:-8081}:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:postgres@timescaledb:5432/deployment_checker?sslmode=disable
    depends_on:
      - timescaledb

volumes:
  timescaledb-data:
